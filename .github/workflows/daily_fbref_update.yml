name: Daily FBref Stats Update

on:
  schedule:
    - cron: '0 3 * * *'    # 3:00 AM UTC daily
  workflow_dispatch:         # manual trigger

jobs:
  fbref-update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DATABASE_URL:    ${{ secrets.DATABASE_URL }}
      SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:    ${{ secrets.SUPABASE_KEY }}
      PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
      RENDER_BACKEND:  ${{ secrets.RENDER_BACKEND }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chrome
        run: |
          wget -q -O - \
            https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor \
            | sudo tee \
              /etc/apt/trusted.gpg.d/google-chrome.gpg \
              > /dev/null
          echo \
            "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee \
              /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable
          echo "Chrome version: $(google-chrome --version)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run team stats collector
        working-directory: backend
        run: |
          echo "==> Scraping FBref team stats..."
          python data/fbref_team_collector.py
          echo "==> Team stats complete"

      - name: Run player stats collector
        working-directory: backend
        run: |
          echo "==> Scraping FBref player stats..."
          python data/fbref_player_collector.py
          echo "==> Player stats complete"

      - name: Trigger fast pipeline on Render
        run: |
          echo "==> Triggering Render pipeline..."
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            "${RENDER_BACKEND}/predict/admin/run-pipeline-fast?secret=${PIPELINE_SECRET}")
          echo "HTTP: $HTTP"
          cat /tmp/resp.json
          if [ "$HTTP" != "200" ]; then
            echo "ERROR: pipeline trigger failed"
            exit 1
          fi

      - name: Wait for pipeline completion
        run: |
          MAX=5400
          INTERVAL=60
          ELAPSED=0
          while [ $ELAPSED -lt $MAX ]; do
            STATUS=$(curl -s \
              "${RENDER_BACKEND}/predict/admin/status" \
              | python3 -c "
          import sys,json

          d=json.load(sys.stdin)

          print(d.get('pipeline_status','unknown'))
          ")
            echo "[${ELAPSED}s] status: $STATUS"
            if [ "$STATUS" = "complete" ]; then
              echo "==> Pipeline complete!"
              break
            fi
            if echo "$STATUS" | grep -qE "failed|timeout|error"; then
              echo "ERROR: pipeline failed: $STATUS"
              exit 1
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED+INTERVAL))
          done
          if [ $ELAPSED -ge $MAX ]; then
            echo "WARNING: timed out after 90 minutes"
            exit 1
          fi

      - name: Verify models ready
        run: |
          READY=$(curl -s \
            "${RENDER_BACKEND}/predict/admin/status" \
            | python3 -c "
          import sys,json

          d=json.load(sys.stdin)

          print(d.get('ready',False))
          ")
          echo "Ready: $READY"
          if [ "$READY" != "True" ]; then
            echo "ERROR: models not ready"
            exit 1
          fi
          echo "==> All models loaded!"

      - name: Print diagnostics
        run: |
          echo "==> Diagnostics:"
          curl -s \
            "${RENDER_BACKEND}/predict/admin/diagnostics" \
            | python3 -c "
          import sys,json

          print(json.dumps(json.load(sys.stdin),indent=2))
          "
