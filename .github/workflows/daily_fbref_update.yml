name: Daily Data Collection + Model Retrain

on:
  schedule:
    - cron: '0 3 * * *'    # 3:00 AM UTC daily
  workflow_dispatch:         # manual trigger

jobs:
  collect-and-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
      PIPELINE_SECRET:   ${{ secrets.PIPELINE_SECRET }}
      RENDER_BACKEND:    ${{ secrets.RENDER_BACKEND }}
      API_FOOTBALL_KEY:  ${{ secrets.API_FOOTBALL_KEY }}
      # soccerdata's download cache (football-data.co.uk CSVs, FBref pages).
      # Pointed at runner.temp so it is cached between runs without ever
      # touching the checked-out working tree.
      SOCCERDATA_DIR:    ${{ runner.temp }}/soccerdata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Cache the raw football-data.co.uk / FBref files soccerdata downloads.
      # `collector.py` skips league-seasons already stored in `matches`, so the
      # cache mostly saves re-fetching the in-progress season after a retry.
      - name: Cache soccerdata downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/soccerdata
          key: soccerdata-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            soccerdata-${{ runner.os }}-

      # ---------------------------------------------------------------------
      # football-data.co.uk match results -> `matches` table.
      #
      # This step did not exist before: `backend/data/collector.py` was never
      # invoked by any workflow, so `matches` stopped changing after the manual
      # initial population and the six leagues added in PR #78 (ELC, PPL, DED,
      # TR1, NOR, AUT) had no historical data for the trainer to use.
      #
      # * Runs first, so builder/trainer (triggered further down via
      #   /predict/admin/run-pipeline-fast) read an up-to-date `matches` table.
      # * `continue-on-error` — a source outage must not block the rest of the
      #   daily run; training simply proceeds on the data already stored.
      # * Incremental — `collect_match_history()` skips league-seasons that are
      #   already stored and re-fetches only the in-progress season, so a daily
      #   run downloads ~11 files, not all 11 leagues x 6 seasons.
      # * Covers every league in `TRAINING_LEAGUES` (the 11) over the dynamic
      #   `SEASONS` range (2021-2022 .. current season) from collector.py.
      # ---------------------------------------------------------------------
      - name: Run Match Collector
        id: match_collector
        continue-on-error: true
        timeout-minutes: 60
        working-directory: backend
        run: |
          echo "==> [1/6] Collecting football-data.co.uk match history (incremental)..."
          python data/collector.py
          echo "==> Match collection complete"

      - name: Run StatsBomb collector
        working-directory: backend
        run: |
          echo "==> [2/6] Downloading StatsBomb open data..."
          python data/statsbomb_collector.py
          if [ $? -ne 0 ]; then
            echo "FATAL: StatsBomb collector failed."
            echo "Pipeline will NOT be triggered."
            echo "No data has been updated."
            exit 1
          fi
          echo "==> StatsBomb collection complete"

      - name: Run FotMob collector (primary)
        id: fotmob
        working-directory: backend
        run: |
          set +e
          echo "==> [3/6] Collecting FotMob stats (primary)..."
          python data/fotmob_collector.py
          if [ $? -ne 0 ]; then
            echo "WARNING: FotMob collector failed."
            echo "fotmob_failed=true" >> $GITHUB_OUTPUT
          else
            echo "==> FotMob collection complete"
            echo "fotmob_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Understat collector (backup)
        working-directory: backend
        if: steps.fotmob.outputs.fotmob_failed == 'true'
        run: |
          set +e
          echo "==> FotMob failed — running Understat backup..."
          python data/understat_collector.py
          if [ $? -ne 0 ]; then
            echo "FATAL: Both FotMob and Understat failed."
            echo "Pipeline will NOT be triggered."
            exit 1
          fi
          echo "==> Understat backup complete"

      # Kept (not deleted) in case the API-Football account is restored, but
      # its failure must not gate the rest of the pipeline: run_all() calls
      # sys.exit(1) when check_status() rejects the key, which used to abort
      # the job before fbref, builder and trainer ever ran.
      - name: Run API-Football collector
        working-directory: backend
        continue-on-error: true
        run: |
          echo "==> [5/6] Collecting API-Football data..."
          python data/api_football_collector.py
          if [ $? -ne 0 ]; then
            # continue-on-error keeps the job alive; the message used to claim
            # the pipeline would not be triggered, which was no longer true.
            echo "WARNING: API-Football collector failed."
            echo "Continuing — the pipeline triggers on the stored data."
            exit 1
          fi
          echo "==> API-Football collection complete"

      # fbref_collector, builder and trainer do NOT run on this runner: this
      # call makes the Render web service run them as subprocesses. See
      # docs/match-collector-pipeline.md for the full picture.
      - name: Trigger FBref + builder + trainer pipeline
        run: |
          echo "==> [6/6] Collector phase finished"
          echo "==> Triggering Render fast pipeline..."
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            "${RENDER_BACKEND}/predict/admin/run-pipeline-fast?secret=${PIPELINE_SECRET}")
          echo "HTTP status: $HTTP"
          cat /tmp/resp.json
          if [ "$HTTP" != "200" ]; then
            echo "FATAL: pipeline trigger failed with HTTP $HTTP"
            exit 1
          fi
          echo "==> Pipeline triggered successfully"

      - name: Wait for pipeline completion
        run: |
          echo "==> Waiting for pipeline to complete..."
          MAX=5400
          INTERVAL=60
          ELAPSED=0
          while [ $ELAPSED -lt $MAX ]; do
            RESPONSE=$(curl -s \
              "${RENDER_BACKEND}/predict/admin/status")
            STATUS=$(echo "$RESPONSE" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print(d.get('pipeline_status','unknown'))
          ")
            RUNNING=$(echo "$RESPONSE" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print(d.get('pipeline_running',False))
          ")
            echo "[${ELAPSED}s] status=${STATUS} running=${RUNNING}"
            if [ "$STATUS" = "complete" ]; then
              echo "==> Pipeline complete!"
              break
            fi
            if echo "$STATUS" | grep -qE "^failed|^timeout|^error"; then
              echo "FATAL: pipeline failed with status: $STATUS"
              exit 1
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED+INTERVAL))
          done
          if [ $ELAPSED -ge $MAX ]; then
            echo "FATAL: pipeline did not complete within 90 minutes"
            exit 1
          fi

      - name: Verify models ready
        run: |
          READY=$(curl -s \
            "${RENDER_BACKEND}/predict/admin/status" \
            | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print(d.get('ready',False))
          ")
          echo "Models ready: $READY"
          if [ "$READY" != "True" ]; then
            echo "FATAL: models not ready after pipeline"
            exit 1
          fi
          echo "==> All models loaded and ready!"

      - name: Print final diagnostics
        run: |
          echo "==> Final diagnostics:"
          curl -s "${RENDER_BACKEND}/predict/admin/diagnostics" \
            | python3 -c "
          import sys,json
          print(json.dumps(json.load(sys.stdin),indent=2))
          "

      - name: Success summary
        run: |
          echo "================================"
          echo "Daily update SUCCESSFUL"
          echo "Date: $(date -u)"
          echo "All collectors: PASSED"
          echo "Pipeline: COMPLETE"
          echo "Models: READY"
          echo "================================"
