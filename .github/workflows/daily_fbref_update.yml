name: Daily Data Collection + Model Retrain

# ─────────────────────────────────────────────────────────────────────────────
# Architecture (moved off Render in this workflow)
#
#   GitHub Actions, ubuntu-latest, 7 GB RAM:
#     [1/5] StatsBomb collector
#     [2/5] FotMob collector (+ Understat backup)
#     [3/5] Match collector (football-data.co.uk via soccerdata)
#     [4/5] Trigger FBref scrape on Render + poll status (max 12 min, non-blocking)
#           (GitHub Actions AWS IPs trigger Cloudflare CAPTCHAs on FBref;
#            Render runs ONLY fbref_collector.py via headless Chrome)
#     [5/5] builder.py -> features.csv, trainer.py -> 9 models
#           -> upload every artifact to Supabase Storage bucket "models"
#     [6/6] POST $RENDER_BACKEND/predict/admin/reload-models
#           (Render only re-downloads the artifacts; it never trains)
#
#   Until PRs #78/#80/#81 this workflow ended with a call to
#   POST /predict/admin/run-pipeline-fast, which ran
#   fbref_collector -> builder -> trainer ON RENDER. Once the training set grew
#   from ~6,776 to 15,000+ rows that exceeded the 512 MB free tier and Render
#   OOM-killed / restarted the service mid-pipeline. Those endpoints now return
#   410 Gone; all heavy work happens on the runner below.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 3 * * *'    # 3:00 AM UTC daily
  workflow_dispatch:        # manual trigger

# A manual run must not overlap the scheduled one: two trainers uploading to
# the same bucket keys would race.
concurrency:
  group: daily-fbref-update
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

  # ── Required secrets (GitHub -> Settings -> Secrets and variables -> Actions)
  # DATABASE_URL                Supabase Postgres (pooler) URL — collectors,
  #                             builder and trainer read/write the same DB.
  # SUPABASE_URL                https://<project>.supabase.co
  # SUPABASE_SERVICE_ROLE_KEY   service_role key: upload/download the "models"
  #                             bucket. SUPABASE_KEY is kept as a fallback
  #                             because that is the name the Render service and
  #                             the previous workflow already use.
  # PIPELINE_SECRET             shared secret for /predict/admin/reload-models
  # RENDER_BACKEND              https://football-predictor-kyk5.onrender.com
  # API_FOOTBALL_KEY            optional, legacy collector (free plan is
  #                             limited; the step never blocks the pipeline)
  # ───────────────────────────────────────────────────────────────────────────
  DATABASE_URL:              ${{ secrets.DATABASE_URL }}
  SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_KEY:              ${{ secrets.SUPABASE_KEY }}
  PIPELINE_SECRET:           ${{ secrets.PIPELINE_SECRET }}
  RENDER_BACKEND:            ${{ secrets.RENDER_BACKEND }}
  API_FOOTBALL_KEY:          ${{ secrets.API_FOOTBALL_KEY }}

jobs:
  collect-and-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fail in seconds, not after an hour of collecting, when a secret that
      # only the final steps need is missing.
      - name: Check required secrets
        run: |
          set -euo pipefail
          missing=()
          [ -n "${DATABASE_URL:-}" ]  || missing+=("DATABASE_URL")
          [ -n "${SUPABASE_URL:-}" ]  || missing+=("SUPABASE_URL")
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${SUPABASE_KEY:-}" ]; then
            missing+=("SUPABASE_SERVICE_ROLE_KEY (or legacy SUPABASE_KEY)")
          fi
          [ -n "${RENDER_BACKEND:-}" ]  || missing+=("RENDER_BACKEND")
          [ -n "${PIPELINE_SECRET:-}" ] || missing+=("PIPELINE_SECRET")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secret(s): ${missing[*]}"
            echo "Add them in GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── [1/5] StatsBomb ────────────────────────────────────────────────────
      # Still the only collector whose failure stops the run before any data
      # is touched: it feeds the H2H/formula tables and fails loudly.
      - name: "[1/5] Run StatsBomb Collector"
        working-directory: backend
        run: |
          echo "==> [1/5] Downloading StatsBomb open data..."
          python data/statsbomb_collector.py
          echo "==> StatsBomb collection complete"

      # ── [2/5] FotMob (+ Understat backup) ─────────────────────────────────
      - name: "[2/5] Run FotMob Collector"
        id: fotmob
        working-directory: backend
        run: |
          set +e
          echo "==> [2/5] Collecting FotMob stats (primary)..."
          python data/fotmob_collector.py
          if [ $? -ne 0 ]; then
            echo "::warning::FotMob collector failed — running the Understat backup."
            echo "fotmob_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "==> FotMob collection complete"
            echo "fotmob_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "[2/5] Run Understat Collector (backup)"
        if: steps.fotmob.outputs.fotmob_failed == 'true'
        working-directory: backend
        run: |
          echo "==> FotMob failed — running Understat backup..."
          python data/understat_collector.py
          echo "==> Understat backup complete"

      # ── [3/5] Match collector ─────────────────────────────────────────────
      # football-data.co.uk historical results (all 11 TRAINING_LEAGUES) and
      # ClubElo history. Incremental: matches ON CONFLICT DO NOTHING, elo
      # ON CONFLICT DO UPDATE. continue-on-error: true — a partial scrape must
      # not block training on the rows that are already in the database.
      - name: "[3/5] Run Match Collector"
        id: matches
        working-directory: backend
        continue-on-error: true
        run: |
          # set +e: capture the exit code instead of letting `bash -e` abort the
          # step before the RC check below can log the warning.
          set +e
          echo "==> [3/5] Collecting historical matches from football-data.co.uk..."
          echo "    Leagues: ENG-Premier League, ESP-La Liga, GER-Bundesliga, ITA-Serie A, FRA-Ligue 1, ENG-Championship, POR-Primeira Liga, NED-Eredivisie, TUR-Süper Lig, NOR-Eliteserien, AUT-Bundesliga (11 leagues)"
          echo "    Seasons: dynamic range 2021-2022 .. current season (season_range() from data/collector.py)"
          echo "    Mode: incremental upsert — ON CONFLICT DO NOTHING (matches) / DO UPDATE (elo_ratings)"
          python data/collector.py
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::warning::Match collector exited $RC — continuing (continue-on-error: true)."
            echo "         Existing matches are preserved; only missing league-seasons failed."
            exit 0
          fi
          echo "==> Match collection complete (all 11 leagues, incremental)"

      # Kept in case the API-Football account is restored. Non-blocking: the
      # free plan rejects 2025+ seasons and run_all() exits 1 in that case.
      - name: "[3b/5] Run API-Football Collector (optional)"
        id: api_football
        working-directory: backend
        continue-on-error: true
        run: |
          set +e
          echo "==> [3b/5] Collecting API-Football data (optional, non-blocking)..."
          python data/api_football_collector.py
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::warning::API-Football collector exited $RC — continuing (free-plan limitation)."
            exit 0
          fi
          echo "==> API-Football collection complete"

      # ── [4/5] FBref (executed on Render, never on GitHub Actions) ────────
      # GitHub Actions runners sit on AWS us-east IPs where FBref challenges
      # headless browsers with an unsolvable Cloudflare CAPTCHA. Render runs
      # ONLY fbref_collector.py (Big Five leagues) and writes directly to
      # Supabase PostgreSQL before builder.py runs below. Both steps exit 0 on
      # failure/timeout so training is never blocked.
      - name: "[4/5] Trigger FBref scrape on Render"
        id: fbref_trigger
        continue-on-error: true
        run: |
          set +e
          BASE="${RENDER_BACKEND%/}"
          URL="$BASE/predict/admin/run-fbref-scrape?secret=${PIPELINE_SECRET}"
          TRIGGERED="false"
          for attempt in 1 2 3; do
            echo "==> [4/5] Triggering FBref scrape on Render (attempt $attempt)..."
            HTTP=$(curl -sS --max-time 90 -o /tmp/fbref_trigger.json -w "%{http_code}" -X POST "$URL")
            RC=$?
            if [ $RC -ne 0 ]; then
              HTTP="000"
            fi
            echo "HTTP status: $HTTP"
            cat /tmp/fbref_trigger.json 2>/dev/null || true
            echo
            if [ "$HTTP" = "200" ]; then
              TRIGGERED="true"
              break
            fi
            sleep 10
          done
          if [ "$TRIGGERED" != "true" ]; then
            echo "::warning::Could not trigger FBref scrape on Render (HTTP $HTTP) — builder.py will use existing fbref_team_stats rows."
          fi
          exit 0

      - name: "[4/5] Wait for FBref scrape on Render (max 12 min)"
        id: fbref_wait
        continue-on-error: true
        run: |
          set +e
          BASE="${RENDER_BACKEND%/}"
          URL="$BASE/predict/admin/fbref-scrape-status?secret=${PIPELINE_SECRET}"
          POLL_SLEEP="${FBREF_POLL_INTERVAL_SECONDS:-30}"
          echo "==> [4/5] Polling Render FBref scrape status (up to 24 x ${POLL_SLEEP}s = 12 min max)..."
          for i in $(seq 1 24); do
            HTTP=$(curl -sS --max-time 30 -o /tmp/fbref_status.json -w "%{http_code}" "$URL")
            RC=$?
            if [ $RC -ne 0 ]; then
              HTTP="000"
            fi
            STATE="unknown"
            if [ "$HTTP" = "200" ] && [ -s /tmp/fbref_status.json ]; then
              STATE=$(python3 - <<'PY'
          import json
          with open("/tmp/fbref_status.json") as fh:
              data = json.load(fh)
          status = str(data.get("status") or "unknown")
          rows = data.get("fbref_team_stats_rows")
          last_run = data.get("last_run_at")
          last_res = data.get("last_result")
          print(f"{status}\t{rows}\t{last_run}\t{last_res}")
          PY
              )
              STATUS=$(printf "%s" "$STATE" | cut -f1)
              ROWS=$(printf "%s" "$STATE" | cut -f2)
              LAST_RUN=$(printf "%s" "$STATE" | cut -f3)
              LAST_RES=$(printf "%s" "$STATE" | cut -f4-)
              echo "    [poll $i/24] status=$STATUS | fbref_team_stats_rows=$ROWS | last_run_at=$LAST_RUN | last_result=$LAST_RES"
              if [ "$STATUS" = "complete" ]; then
                echo "==> FBref scrape complete on Render! fbref_team_stats_rows=$ROWS"
                exit 0
              fi
              if [ "$STATUS" = "failed" ]; then
                echo "::warning::FBref scrape failed on Render ($LAST_RES) — builder.py will proceed with existing DB rows ($ROWS)."
                exit 0
              fi
            else
              echo "    [poll $i/24] HTTP=$HTTP waiting for Render status response..."
            fi
            if [ "$i" -lt 24 ]; then
              sleep "$POLL_SLEEP"
            fi
          done
          echo "::warning::FBref scrape did not finish within 12 minutes (24 polls) — builder.py will proceed with existing DB rows."
          exit 0

      # ── [5/5] Builder + Trainer ───────────────────────────────────────────
      # This is the memory-heavy part that OOM-killed Render. A 7 GB runner
      # has ~14x the headroom.
      - name: "[5/5] Build features (builder.py)"
        working-directory: backend
        run: |
          echo "==> [5/5] Building features.csv from matches + elo + FBref..."
          python features/builder.py
          echo "==> Sanity-checking features.csv before training..."
          # --min-rows guards against a builder that produced almost nothing
          # (the daily dataset is ~15,000 rows; 1,000 is a catastrophic-failure
          # floor, not a quality target).
          python scripts/check_features.py --min-rows 1000

      # Fails the run BEFORE a 9-model training pass if the feature code that
      # built features.csv and the inference path in routers/predict.py have
      # drifted apart. The models would otherwise train happily and then score
      # live fixtures from different numbers, with no error anywhere.
      - name: "[5/5] Feature parity regression tests"
        working-directory: backend
        run: |
          echo "==> Checking training/inference feature parity..."
          python -m unittest tests.test_feature_parity -v

      # Fails the run if the formula engine's league calibration ever stops
      # being scoped to one league and one season: league_teams would report
      # every club in team_season_stats instead of the league's, and every
      # attack/defence rating would be normalised against the wrong mean.
      - name: "[5/5] League-scope regression tests (formula engine)"
        working-directory: backend
        run: |
          echo "==> Checking league baselines are league+season scoped..."
          python -m unittest tests.test_formula_league_scope -v

      - name: "[5/5] Train + upload models (trainer.py)"
        working-directory: backend
        run: |
          echo "==> Training all 9 models and uploading to Supabase Storage..."
          echo "    result (logistic) | result (xgboost) | home goals | away goals"
          echo "    home corners | away corners | BTTS | Over 2.5 | Over 9.5 corners"
          # --strict-upload: any missing artifact or failed upload exits 1, so
          # the workflow can never tell Render to reload a partial model set.
          python models/trainer.py --strict-upload

      - name: "[5/5] Verify uploaded artifacts in Supabase Storage"
        working-directory: backend
        run: |
          echo "==> Verifying bucket contents (models/*, encoders, features.csv)..."
          python scripts/verify_remote_artifacts.py

      # ── [6/6] Notify Render ───────────────────────────────────────────────
      # Render only re-downloads the pre-built files into memory. The endpoint
      # never runs builder/trainer/collectors, so it finishes in seconds and
      # cannot OOM the 512 MB instance.
      - name: "[6/6] Notify Render to reload models"
        run: |
          set -euo pipefail
          BASE="${RENDER_BACKEND%/}"
          URL="$BASE/predict/admin/reload-models?secret=${PIPELINE_SECRET}"
          for attempt in 1 2 3; do
            echo "==> [6/6] POST /predict/admin/reload-models (attempt $attempt)..."
            HTTP=$(curl -sS --max-time 120 -o /tmp/reload.json -w "%{http_code}" -X POST "$URL") || HTTP=000
            echo "HTTP status: $HTTP"
            cat /tmp/reload.json 2>/dev/null || true
            echo
            if [ "$HTTP" = "200" ]; then
              python3 - <<'PY'
          import json
          with open("/tmp/reload.json") as fh:
              data = json.load(fh)
          assert data.get("status") == "reloaded", data
          print(f"Reloaded {len(data.get('models_loaded', []))} models and "
                f"{data.get('features_rows')} feature rows in "
                f"{data.get('reload_seconds')}s")
          PY
              exit 0
            fi
            case "$HTTP" in
              409|502|503|504|000) sleep 15 ;;
              *)
                echo "::error::reload-models returned HTTP $HTTP"
                exit 1
                ;;
            esac
          done
          echo "::error::reload-models did not succeed after 3 attempts"
          exit 1

      - name: Verify models ready
        run: |
          set -euo pipefail
          BASE="${RENDER_BACKEND%/}"
          for attempt in $(seq 1 12); do
            BODY=$(curl -sS --max-time 30 "$BASE/predict/admin/status" || true)
            if echo "$BODY" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          models = data.get("models_loaded") or []
          ok = bool(data.get("ready")) and int(data.get("features_rows") or 0) > 0
          print("status=%s ready=%s models=%d features_rows=%s last_reload_at=%s" % (
              data.get("pipeline_status"), data.get("ready"), len(models),
              data.get("features_rows"), data.get("last_reload_at")))
          sys.exit(0 if ok else 1)
          '; then
              echo "==> All models loaded and ready!"
              exit 0
            fi
            echo "    attempt $attempt/12 not ready yet — retrying in 5s"
            sleep 5
          done
          echo "::error::models not ready after reload-models"
          exit 1

      # Reporting only: a diagnostics hiccup must not turn a successful daily
      # run red (e.g. the DB being briefly unavailable while it queries stats).
      - name: Print final diagnostics
        continue-on-error: true
        run: |
          curl -sS --max-time 30 "${RENDER_BACKEND%/}/predict/admin/diagnostics" \
            | python3 -c "
          import sys,json
          print(json.dumps(json.load(sys.stdin),indent=2))
          " || echo "WARNING: diagnostics unavailable — pipeline itself succeeded"

      - name: Success summary
        run: |
          echo "================================================================"
          echo "Daily update SUCCESSFUL"
          echo "Date       : $(date -u)"
          echo "Collectors : StatsBomb, FotMob, Match (GitHub Actions) + FBref (Render)"
          echo "Training   : builder.py + trainer.py on this GitHub Actions runner"
          echo "Artifacts  : Supabase Storage bucket 'models' (9 models + encoders + features.csv)"
          echo "Render     : FBref scraped via /predict/admin/run-fbref-scrape; models reloaded via /predict/admin/reload-models"
          echo "================================================================"
